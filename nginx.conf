server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't cache the SPA shell / html entrypoints
    location = /_shell.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve static files and prerendered pages; fall back to the SPA shell
    # for client-side routed app paths.
    location / {
        try_files $uri $uri.html $uri/ /_shell.html;
    }
}
